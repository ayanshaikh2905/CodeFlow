[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codeflow-analyzer"
version = "0.1.0"
description = "Deterministic Python backend flow analyzer"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "typer>=0.12,<1"]

[project.optional-dependencies]
dev = ["mypy>=1.10,<2", "pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
codeflow = "codeflow.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["codeflow"]
