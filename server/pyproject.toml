[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codeflow-server"
version = "0.1.0"
description = "FastAPI endpoints for CodeFlow analysis and scenarios"
requires-python = ">=3.11"
dependencies = [
  "codeflow-analyzer>=0.1.0",
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["codeflow_server"]
