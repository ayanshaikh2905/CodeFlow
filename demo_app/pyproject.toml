[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codeflow-demo-app"
version = "0.1.0"
description = "FastAPI and SQLAlchemy demo project for CodeFlow"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["demo_app*"]
